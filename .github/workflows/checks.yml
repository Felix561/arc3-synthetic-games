name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: arc3-synthetic-games verify
      - run: python -m ruff check src tests tools web
      - run: python -m pytest -q
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tools/build_preview.py --output _preview/arc3-synthetic-games
      - run: python tools/check_browser.py --write-golden /tmp/native-golden.json
      - name: Compare browser gameplay with native reference
        run: |
          python -m http.server 8782 --bind 127.0.0.1 --directory _preview > /tmp/preview-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python tools/check_browser.py --golden /tmp/native-golden.json
